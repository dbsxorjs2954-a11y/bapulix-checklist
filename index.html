<style>
:root{
  --bg:#f7f3f2;
  --surface:#ffffff;
  --surface-2:#fbf8f7;
  --border:#ddd3d1;
  --border-soft:#ede6e4;
  --text:#241f1e;
  --text-dim:#8a7d7a;
  --text-faint:#a89c99;
  --accent:#c8102e;
  --accent-dark:#9c0c22;
  --head-bg:#47403f;
  --head-text:#ffffff;
  --ok:#1e8e3e;
  --warn:#c98400;
  --warn-ink:#231b0a;
  --danger-bg:#fbe7e6;
  --danger-fg:#9c0c22;
  --shadow:0 1px 4px rgba(36,31,30,.08);
  --shadow-lg:0 -2px 10px rgba(36,31,30,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0a0a;
    --surface:#161313;
    --surface-2:#131111;
    --border:#2b2422;
    --border-soft:#1f1b1a;
    --text:#f5f1ef;
    --text-dim:#a89f9c;
    --text-faint:#7c7371;
    --accent:#e8142f;
    --accent-dark:#b80f24;
    --head-bg:#1e1918;
    --head-text:#f5f1ef;
    --ok:#33d17a;
    --warn:#ffb648;
    --warn-ink:#231b0a;
    --danger-bg:rgba(232,20,47,.16);
    --danger-fg:#ff5c72;
    --shadow:0 1px 4px rgba(0,0,0,.5);
    --shadow-lg:0 -2px 10px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0a0a;--surface:#161313;--surface-2:#131111;--border:#2b2422;--border-soft:#1f1b1a;
  --text:#f5f1ef;--text-dim:#a89f9c;--text-faint:#7c7371;--accent:#e8142f;--accent-dark:#b80f24;
  --head-bg:#1e1918;--head-text:#f5f1ef;--ok:#33d17a;--warn:#ffb648;--warn-ink:#231b0a;
  --danger-bg:rgba(232,20,47,.16);--danger-fg:#ff5c72;
  --shadow:0 1px 4px rgba(0,0,0,.5);--shadow-lg:0 -2px 10px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#f7f3f2;--surface:#ffffff;--surface-2:#fbf8f7;--border:#ddd3d1;--border-soft:#ede6e4;
  --text:#241f1e;--text-dim:#8a7d7a;--text-faint:#a89c99;--accent:#c8102e;--accent-dark:#9c0c22;
  --head-bg:#47403f;--head-text:#ffffff;--ok:#1e8e3e;--warn:#c98400;--warn-ink:#231b0a;
  --danger-bg:#fbe7e6;--danger-fg:#9c0c22;
  --shadow:0 1px 4px rgba(36,31,30,.08);--shadow-lg:0 -2px 10px rgba(36,31,30,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-user-select:none;
  user-select:none;
  overscroll-behavior:none;
}
input,textarea{-webkit-user-select:text;user-select:text;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#app{max-width:900px;margin:0 auto;padding-bottom:110px;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--accent);
  color:#fff;
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px;text-wrap:balance;}
.topbar .sub{font-size:11px;opacity:.85;margin-top:2px;}
.topbtn{
  background:rgba(255,255,255,.18);
  color:#fff;border:none;border-radius:8px;
  padding:9px 12px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:4px;
}
.topbtn:active{background:rgba(255,255,255,.35);}

/* ---------- List view ---------- */
.listwrap{padding:16px;}
.searchbar{
  display:flex;gap:8px;margin-bottom:14px;
}
.searchbar input{
  flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  font-size:15px;background:var(--surface);color:var(--text);
}
.newbtn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:12px 18px;font-size:15px;font-weight:700;white-space:nowrap;
}
.newbtn:active{background:var(--accent-dark);}
.card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--shadow);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.card .info{min-width:0;}
.card .info b{font-size:16px;}
.card .info .meta{font-size:12px;color:var(--text-dim);margin-top:4px;}
.card .score{font-size:11px;color:var(--text-faint);margin-top:4px;font-variant-numeric:tabular-nums;}
.card .actions{display:flex;gap:6px;flex-shrink:0;}
.iconbtn{
  border:none;background:var(--border-soft);border-radius:8px;
  width:38px;height:38px;font-size:16px;color:var(--text-dim);
}
.iconbtn.del{background:var(--danger-bg);color:var(--danger-fg);}
.empty{text-align:center;color:var(--text-dim);padding:60px 20px;font-size:14px;line-height:1.7;}

/* ---------- Form view ---------- */
.section{
  background:var(--surface);border:1px solid var(--border-soft);margin:14px 16px;border-radius:12px;overflow:hidden;
  box-shadow:var(--shadow);
}
.section-head{
  background:var(--head-bg);color:var(--head-text);
  padding:10px 14px;font-size:14px;font-weight:700;letter-spacing:.3px;
}
.infogrid{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.infogrid .full{grid-column:1/-1;}
.field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;}
.field input[type=text],.field input[type=date]{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--surface-2);color:var(--text);
}
.row{
  display:flex;align-items:center;border-top:1px solid var(--border-soft);
}
.row:first-child{border-top:none;}
.row .label{flex:1;padding:11px 12px;font-size:13.5px;line-height:1.4;}
.row .label small{display:block;color:var(--text-faint);font-size:11px;margin-top:2px;}
.seg{display:flex;gap:6px;padding:8px 12px;}
.segbtn{
  border:1.5px solid var(--border);background:var(--surface);border-radius:8px;
  min-width:44px;height:38px;font-size:13px;font-weight:700;color:var(--text-faint);
}
.segbtn.y.active{background:var(--ok);border-color:var(--ok);color:#fff;}
.segbtn.n.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.segbtn.o.active{background:var(--ok);border-color:var(--ok);color:#fff;}
.segbtn.t.active{background:var(--warn);border-color:var(--warn);color:var(--warn-ink);}
.segbtn.x.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.dualrow{display:flex;border-top:1px solid var(--border-soft);}
.dualrow:first-child{border-top:none;}
.dualcol{flex:1;display:flex;align-items:center;min-width:0;}
.dualcol .label{flex:1;padding:11px 8px 11px 12px;font-size:13px;}
.dualcol .seg{padding:8px 8px 8px 4px;}
.dualcol.mid{border-left:1px solid var(--border-soft);}

.notewrap{padding:10px 12px;border-top:1px solid var(--border-soft);}
.notewrap label{font-size:11px;color:var(--text-dim);font-weight:600;display:block;margin-bottom:6px;}
textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-size:14px;font-family:inherit;resize:vertical;min-height:70px;background:var(--surface-2);color:var(--text);
}
.fbtextarea{min-height:90px;}

.sigwrap{padding:12px 14px;}
.sigwrap>label{font-size:11px;color:var(--text-dim);font-weight:600;display:block;margin-bottom:6px;}
.sigbox{
  border:1.5px dashed var(--border);border-radius:10px;background:#fdfdfd;
  position:relative;
}
canvas{display:block;width:100%;height:160px;touch-action:none;border-radius:10px;}
.sigctrl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.sigctrl .hint{font-size:11px;color:var(--text-faint);}
.smallbtn{border:none;background:var(--border-soft);border-radius:7px;padding:7px 12px;font-size:12px;color:var(--text-dim);font-weight:600;}

/* ---------- Bottom action bar (form) ---------- */
.bottombar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--border);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;justify-content:center;
  box-shadow:var(--shadow-lg);
}
.bottombar button{
  flex:1;max-width:220px;padding:13px 10px;border-radius:10px;border:none;
  font-size:14px;font-weight:700;
}
.bottombar .back{background:var(--border-soft);color:var(--text-dim);}
.bottombar .save{background:var(--accent);color:#fff;}
.bottombar .save:active{background:var(--accent-dark);}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  background:var(--surface);color:var(--text);border-radius:16px 16px 0 0;width:100%;max-width:900px;
  padding:16px;max-height:70vh;overflow:auto;
}
.modal h3{margin:0 0 12px;font-size:16px;}
.modal p{color:var(--text-dim);}
.modal button.full{width:100%;margin-top:8px;padding:13px;border-radius:10px;border:none;font-size:14px;font-weight:600;background:var(--border-soft);color:var(--text);}
.modal pre{white-space:pre-wrap;font-size:13px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px;color:var(--text);}
.modal textarea.copybox{width:100%;min-height:160px;border:1px solid var(--border-soft);border-radius:8px;padding:10px;font-size:12.5px;font-family:inherit;background:var(--surface-2);color:var(--text);white-space:pre-wrap;}
.modal textarea.settings-field{width:100%;min-height:76px;border:1px solid var(--border-soft);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;background:var(--surface-2);color:var(--text);}
.modal textarea.settings-field.tall{min-height:150px;}
.modal .hint{font-size:12px;color:var(--text-dim);margin:8px 0;line-height:1.5;}
.modal.wide{max-width:900px;}
.modal img.report-img{width:100%;display:block;border-radius:6px;margin-bottom:12px;border:1px solid var(--border-soft);-webkit-touch-callout:default;}

/* print-sheet: rendered off-screen, captured by html2canvas into a plain <img> the user can long-press to save */
.print-sheet{position:fixed;left:-10000px;top:0;width:780px;background:#fff;color:#111;font-size:12px;line-height:1.3;padding:10px;border-radius:8px;}
.print-sheet *{box-sizing:border-box;}
.print-sheet + .print-sheet{margin-top:14px;}
.print-sheet .ps-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;border-bottom:2.5px solid #c8102e;padding-bottom:6px;}
.print-sheet .ps-head .ps-badge{height:26px;width:auto;display:block;}
.print-sheet .ps-head h2{font-size:15px;margin:0;letter-spacing:1.2px;}
.print-sheet table{width:100%;border-collapse:collapse;margin-bottom:0;table-layout:fixed;}
.print-sheet table.info-tb{margin-bottom:8px;}
.print-sheet table.chk-tb{margin-top:5px;}
.print-sheet th,.print-sheet td{border:1px solid #555;padding:3px 6px;vertical-align:middle;font-size:11px;word-break:keep-all;}
.print-sheet .info-tb th{background:#f0f0f0;font-weight:700;width:15%;text-align:center;}
.print-sheet .info-tb td{width:35%;}
.print-sheet .grouphead{background:#47403f;color:#fff;font-weight:700;text-align:center;width:8%;}
.print-sheet .items-tb td.ilabel{width:23%;}
.print-sheet .items-tb td.yn{width:14%;text-align:center;white-space:nowrap;}
.print-sheet .note-row td{background:#fafafa;font-size:10.5px;color:#333;text-align:left;}
.print-sheet .chk-tb td.cmark{width:110px;text-align:center;white-space:nowrap;}
.print-sheet .chk-tb td.cmark.etctext{text-align:left;white-space:normal;}
.print-sheet .mark{display:inline-block;min-width:16px;text-align:center;padding:1px 5px;color:#999;font-weight:700;border-radius:4px;}
.print-sheet .mark.y.on, .print-sheet .mark.o.on{background:#1e8e3e;color:#fff;}
.print-sheet .mark.n.on, .print-sheet .mark.x.on{background:#c8102e;color:#fff;}
.print-sheet .mark.t.on{background:#e8a300;color:#241b04;}
.print-sheet .sep{color:#ccc;margin:0 1px;font-size:9px;}
.print-sheet .fb-block{border:1px solid #555;border-top:none;margin-bottom:0;}
.print-sheet .fb-block:first-of-type{border-top:1px solid #555;}
.print-sheet .fb-title{background:#e9e9e9;font-weight:700;padding:7px 10px;border-bottom:1px solid #555;font-size:11.5px;}
.print-sheet .fb-body{padding:14px;min-height:140px;white-space:pre-wrap;font-size:11.5px;}
.print-sheet .sig-block{border:1px solid #555;margin-top:14px;border-radius:4px;overflow:hidden;}
.print-sheet .sig-title{background:#e9e9e9;font-weight:700;padding:5px 8px;border-bottom:1px solid #555;font-size:10.5px;}
.print-sheet .sig-body{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 16px;}
.print-sheet .sig-name{font-size:11.5px;color:#555;}
.print-sheet .sig-name b{font-size:15px;color:#111;margin-left:8px;}
.print-sheet .sig-pad{display:flex;align-items:flex-end;gap:10px;min-width:230px;}
.print-sheet .sig-line{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1.5px solid #333;}
.print-sheet .sig-img{max-height:52px;max-width:100%;}
.print-sheet .sig-empty{color:#bbb;font-size:10.5px;padding-bottom:6px;}
</style>

const TEMPLATE_KEY = 'bapulix_template_v1';
function defaultTemplate(){
  return {
    exL:[...DEFAULT_EXCLUSIVE_L], exR:[...DEFAULT_EXCLUSIVE_R],
    wtL:[...DEFAULT_WEIGHT_L], wtR:[...DEFAULT_WEIGHT_R],
    bsL:[...DEFAULT_BASE_L], bsR:[...DEFAULT_BASE_R],
    hygiene:[...DEFAULT_HYGIENE], cooking:[...DEFAULT_COOKING], operation:[...DEFAULT_OPERATION]
  };
}
function loadTemplate(){
  try{
    const raw = localStorage.getItem(TEMPLATE_KEY);
    if(raw) return Object.assign(defaultTemplate(), JSON.parse(raw));
  }catch(e){}
  return defaultTemplate();
}
let EXCLUSIVE_L, EXCLUSIVE_R, WEIGHT_L, WEIGHT_R, BASE_L, BASE_R, HYGIENE, COOKING, OPERATION;

  HYGIENE=t.hygiene; COOKING=t.cooking; OPERATION=t.operation;
}
function saveTemplate(t){
  localStorage.setItem(TEMPLATE_KEY, JSON.stringify(t));
  applyTemplate(t);
}

function parseLinesPreserve(text){
  const lines = text.split('\n').map(l=>l.replace(/\r$/,''));
  while(lines.length && lines[lines.length-1]==='') lines.pop();
  return lines;
}
function parseLinesFilter(text){
  return text.split('\n').map(l=>l.replace(/\r$/,'').trim()).filter(l=>l.length>0);
}

/* ---------------- Storage ---------------- */
const STORE_KEY = 'bapulix_visits_v1';
function loadVisits(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||[]; }catch(e){ return []; } }
function saveVisits(v){ localStorage.setItem(STORE_KEY, JSON.stringify(v)); }

/* ---------------- Shared sync (Google Sheets via Apps Script Web App) ---------------- */
const SYNC_KEY = 'bapulix_sync_url_v1';
function getSyncUrl(){ return (localStorage.getItem(SYNC_KEY)||'').trim(); }
function setSyncUrl(u){ localStorage.setItem(SYNC_KEY, (u||'').trim()); }
async function syncPush(visit){
  const url = getSyncUrl();
  if(!url) return;
  try{
    await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(visit) });
  }catch(e){ console.warn('sync push failed', e); }
}
async function syncDelete(id){
  const url = getSyncUrl();
  if(!url) return;
  try{
    await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({id, __delete:true}) });
  }catch(e){ console.warn('sync delete failed', e); }
}
async function syncNow(){
  const url = getSyncUrl();
  if(!url){ showAlert('먼저 백업 메뉴에서 공유 저장소 주소를 입력해주세요.'); return; }
  const btn = document.querySelector('[data-action="sync-now"]');
  const original = btn ? btn.textContent : '';
  if(btn){ btn.textContent = '동기화 중...'; btn.disabled = true; }
  try{
    const res = await fetch(url + (url.includes('?')?'&':'?') + '_=' + Date.now());
    if(!res.ok) throw new Error('bad status '+res.status);
    const remote = await res.json();
    const byId = new Map(visits.map(v=>[v.id,v]));
    remote.forEach(rv=>{ byId.set(rv.id, rv); });
    visits = Array.from(byId.values());
    saveVisits(visits);
    render();
    showAlert(`동기화 완료 (공유 저장소 ${remote.length}건)`);
  }catch(e){
    showAlert('동기화에 실패했습니다. 주소와 인터넷 연결을 확인해주세요.\n('+String(e)+')');
  } finally {
    if(btn){ btn.textContent = original; btn.disabled = false; }
  }
}

function uid(){ return 'v_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }

function blankVisit(){
  return {
    id: uid(),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    info:{ store:'', owner:'', visor:'', visorTeam:'', date: todayStr(), ownerConfirmName:'', signature:'' },
    values:{}, // key -> 'Y'|'N'|'O'|'T'|'X'

/* ---------------- Rendering helpers ---------------- */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function segYN(key){
  const v = current.values[key];
  return `<div class="seg">
    <button type="button" class="segbtn y ${v==='Y'?'active':''}" data-action="toggle" data-key="${key}" data-value="Y">Y</button>
    <button type="button" class="segbtn n ${v==='N'?'active':''}" data-action="toggle" data-key="${key}" data-value="N">N</button>
  </div>`;
}
function segOTX(key){
  const v = current.values[key];
  return `<div class="seg">
    <button type="button" class="segbtn o ${v==='O'?'active':''}" data-action="toggle" data-key="${key}" data-value="O">O</button>
    <button type="button" class="segbtn t ${v==='T'?'active':''}" data-action="toggle" data-key="${key}" data-value="T">△</button>
    <button type="button" class="segbtn x ${v==='X'?'active':''}" data-action="toggle" data-key="${key}" data-value="X">X</button>
  </div>`;
}

function dualRows(prefixL, prefixR, listL, listR){
  let html='';
  const n = Math.max(listL.length, listR.length);
  for(let i=0;i<n;i++){
    const l = listL[i], r = listR[i];
    html += `<div class="dualrow">
      <div class="dualcol">
        ${l ? `<div class="label">${escapeHtml(l)}</div>${segYN(prefixL+i)}` : `<div class="label"></div>`}
      </div>
      <div class="dualcol mid">
        ${r ? `<div class="label">${escapeHtml(r)}</div>${segYN(prefixR+i)}` : `<div class="label"></div>`}
      </div>
    </div>`;
  }
  return html;
}

function checkRows(prefix, list, useEtcAsText){
  return list.map((item,i)=>{
    if(useEtcAsText && item.startsWith('기타')){
      return `<div class="notewrap">
        <label>${escapeHtml(item)}</label>
        <textarea data-path="notes.ckEtc" placeholder="특이사항을 입력하세요">${escapeHtml(current.notes.ckEtc)}</textarea>
      </div>`;
    }
    const parts = item.split('|');
    return `<div class="row">
      <div class="label">${escapeHtml(parts[0])}${parts[1]?`<small>${escapeHtml(parts[1])}</small>`:''}</div>
      ${segOTX(prefix+i)}
    </div>`;
  }).join('');
}

function renderList(){

  const filtered = visits
    .slice()
    .sort((a,b)=>b.updatedAt-a.updatedAt)

    return `<div class="card" data-id="${v.id}">
      <div class="info" data-action="open" data-id="${v.id}">
        <b>${escapeHtml(v.info.store)||'(지점명 미입력)'}</b>
        <div class="meta">${escapeHtml(v.info.date||'')} · 점주 ${escapeHtml(v.info.owner)||'-'} · 바이저 ${escapeHtml(v.info.visor)||'-'}</div>
        <div class="score">체크 완료 ${st.done}/${st.total} · O/△/X ${st.o}/${st.t}/${st.x}</div>
      </div>

  <div class="topbar">
    <div><h1>밥풀릭스 방문 Check List</h1><div class="sub">가맹점 방문 점검</div></div>
    <div style="display:flex;gap:6px;">
      ${getSyncUrl()?`<button class="topbtn" data-action="sync-now">🔄</button>`:''}
      <button class="topbtn" data-action="settings">⚙ 설정</button>
      <button class="topbtn" data-action="backup">⋮ 백업</button>
    </div>
  </div>
  <div class="listwrap">
    <div class="searchbar">
      <input type="text" placeholder="지점명/점주명 검색" value="${escapeHtml(state.search)}" data-action="search">
      <button class="newbtn" data-action="new">+ 새 체크리스트</button>
    </div>

  </div>`;

function summarize(v){
  const keys = Object.keys(v.values);
  let done=0,o=0,t=0,x=0;
  keys.forEach(k=>{
    const val=v.values[k];
    if(val){done++;}
    if(val==='O')o++; if(val==='T')t++; if(val==='X')x++;
  });
  const cookingCheckable = COOKING.filter(x=>!x.startsWith('기타')).length;
  return {done, total: keys.length || (EXCLUSIVE_L.length+EXCLUSIVE_R.filter(x=>x).length+WEIGHT_L.length+WEIGHT_R.filter(x=>x).length+BASE_L.length+BASE_R.filter(x=>x).length+HYGIENE.length+cookingCheckable+OPERATION.length), o,t,x};
}

function render(){
  const app = document.getElementById('app');
  if(state.view==='list'){
    app.innerHTML = renderList();
  } else {
    app.innerHTML = renderForm();
    setupSignature();
  }
  if(state.modal){ renderModal(); }
}

/* ---------------- Signature pad ---------------- */
function setupSignature(){
  const canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = '#1a1a1a';

  if(current.info.signature){
    const img = new Image();
    img.onload = ()=> sigCtx.drawImage(img,0,0,rect.width,rect.height);
    img.src = current.info.signature;
  }

  let last = null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function down(e){ sigDrawing=true; last = pos(e); canvas.setPointerCapture(e.pointerId); }
  function move(e){
    if(!sigDrawing) return;
    const p = pos(e);
    sigCtx.beginPath(); sigCtx.moveTo(last.x,last.y); sigCtx.lineTo(p.x,p.y); sigCtx.stroke();
    last = p;
  }
  function up(){
    if(!sigDrawing) return;
    sigDrawing=false;
    current.info.signature = canvas.toDataURL('image/png');
  }
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointerleave', up);
}

/* ---------------- Path get/set ---------------- */
function setPath(obj, path, value){
  const parts = path.split('.');
  let o = obj;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = value;
}

/* ---------------- Print sheet (table layout matching original form) ---------------- */
function ynCell(val){
  return `<span class="mark y ${val==='Y'?'on':''}">Y</span><span class="sep">/</span><span class="mark n ${val==='N'?'on':''}">N</span>`;
}
function otxCell(val){
  return `<span class="mark o ${val==='O'?'on':''}">O</span><span class="sep">·</span><span class="mark t ${val==='T'?'on':''}">△</span><span class="sep">·</span><span class="mark x ${val==='X'?'on':''}">X</span>`;
}
function itemsGroupRows(v, label, L, R, pL, pR, note){
  const n = Math.max(L.length, R.length);
  let rows = '';
  for(let i=0;i<n;i++){
    const l=L[i], r=R[i];
    rows += `<tr>
      ${i===0?`<th class="grouphead" rowspan="${n+1}">${escapeHtml(label)}</th>`:''}
      <td class="ilabel">${escapeHtml(l||'')}</td><td class="yn">${l?ynCell(v.values[pL+i]):''}</td>
      <td class="ilabel">${escapeHtml(r||'')}</td><td class="yn">${r?ynCell(v.values[pR+i]):''}</td>
    </tr>`;
  }
  rows += `<tr class="note-row"><td colspan="4">비고: ${escapeHtml(note)||'-'}</td></tr>`;
  return rows;
}
function checkGroupRows(v, label, list, prefix, etcVal){
  let rows = '';
  const real = list.filter(item=>!item.startsWith('기타'));
  const rowCount = list.length;
  list.forEach((item,i)=>{
    if(item.startsWith('기타')){
      rows += `<tr>
        ${i===0?`<th class="grouphead" rowspan="${rowCount}">${escapeHtml(label)}</th>`:''}
        <td class="clabel">${escapeHtml(item)}</td>
        <td class="cmark etctext">${escapeHtml(etcVal)||'-'}</td>
      </tr>`;
      return;
    }
    const parts = item.split('|');
    rows += `<tr>
      ${i===0?`<th class="grouphead" rowspan="${rowCount}">${escapeHtml(label)}</th>`:''}
      <td class="clabel">${escapeHtml(parts[0])}${parts[1]?` <span style="color:#777;font-size:9.5px;">${escapeHtml(parts[1])}</span>`:''}</td>
      <td class="cmark">${otxCell(v.values[prefix+i])}</td>
    </tr>`;
  });
  return rows;
}

    <div class="fb-block"><div class="fb-title">운영관련 피드백 (인건비, 식자재, 운영시간)</div><div class="fb-body">${escapeHtml(v.feedback.operation)||'-'}</div></div>
    <div class="fb-block"><div class="fb-title">신메뉴 도입 여부</div><div class="fb-body">${escapeHtml(v.feedback.newMenu)||'-'}</div></div>

        <div class="sig-pad">
          <div class="sig-line">${i.signature?`<img class="sig-img" src="${i.signature}">`:`<div class="sig-empty">서명 없음</div>`}</div>
        </div>
      </div>

async function openReportModal(){
  if(!current) return;
  state.modal = { type:'report', loading:true };
  renderModal();
  const tempWrap = document.createElement('div');
  tempWrap.id = 'reportCaptureTemp';
  tempWrap.innerHTML = buildPrintHTML(current);
  document.body.appendChild(tempWrap);
  try{
    const images = [];
    for(const id of ['pdfPage1','pdfPage2']){
      const el = document.getElementById(id);
      if(!el) continue;
      const canvas = await html2canvas(el, { scale:2, backgroundColor:'#ffffff' });
      images.push(canvas.toDataURL('image/png'));
    }
    state.modal = { type:'report', images };
  } catch(e){
    state.modal = { type:'alert', message:'이미지 생성에 실패했습니다: '+String(e) };
  } finally {
    tempWrap.remove();
    renderModal();
  }
}

/* ---------------- Text summary ---------------- */
function buildSummary(v){
  const i = v.info;
  const lines = [];
  lines.push(`[밥풀릭스 방문 체크리스트]`);
  lines.push(`지점명: ${i.store||'-'}   점주: ${i.owner||'-'}`);
  lines.push(`바이저: ${i.visor||'-'}   바이저 팀장: ${i.visorTeam||'-'}`);
  lines.push(`날짜: ${i.date||'-'}`);
  lines.push('');
  function dumpDual(title, L, R, pL, pR){
    lines.push(`■ ${title}`);
    const n = Math.max(L.length,R.length);
    for(let k=0;k<n;k++){
      const l=L[k], r=R[k];
      if(l) lines.push(`  ${l}: ${v.values[pL+k]||'-'}`);
      if(r) lines.push(`  ${r}: ${v.values[pR+k]||'-'}`);
    }
    lines.push('');
  }
  dumpDual('전용품목', EXCLUSIVE_L, EXCLUSIVE_R, 'ex_L','ex_R');
  dumpDual('중량확인', WEIGHT_L, WEIGHT_R, 'wt_L','wt_R');
  dumpDual('베이스 및 구성품', BASE_L, BASE_R, 'bs_L','bs_R');

  function dumpCheck(title, list, prefix, etcVal){
    lines.push(`■ ${title}`);
    list.forEach((item,k)=>{
      if(item.startsWith('기타')) return;
      const label = item.split('|')[0];
      lines.push(`  ${label}: ${v.values[prefix+k]||'-'}`);
    });
    if(etcVal!==undefined) lines.push(`  기타(특이사항): ${etcVal||'-'}`);
    lines.push('');
  }
  dumpCheck('위생', HYGIENE, 'hy');
  dumpCheck('조리', COOKING, 'ck', v.notes.ckEtc);
  dumpCheck('운영', OPERATION, 'op');

  lines.push(`■ 피드백`);
  lines.push(`매출 관련: ${v.feedback.sales||'-'}`);
  lines.push(`운영 관련: ${v.feedback.operation||'-'}`);
  lines.push(`신메뉴 도입: ${v.feedback.newMenu||'-'}`);
  lines.push(`기타/점주의견: ${v.feedback.etc||'-'}`);
  lines.push('');
  lines.push(`점주 확인: ${i.ownerConfirmName||'-'} ${i.signature?'(서명 완료)':'(서명 없음)'}`);
  return lines.join('\n');
}

/* ---------------- Event handling ---------------- */
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  if(action==='modal-close' && t.classList.contains('modal-backdrop') && t!==e.target) return;

  if(action==='new'){
    current = blankVisit();
    state.view='form'; state.currentId=current.id;
    render();
  } else if(action==='open'){
    const v = visits.find(x=>x.id===t.dataset.id);
    if(v){ current = JSON.parse(JSON.stringify(v)); state.view='form'; state.currentId=v.id; render(); }
  } else if(action==='delete'){
    e.stopPropagation();
    const delId = t.dataset.id;
    showConfirm('이 체크리스트를 삭제할까요? 되돌릴 수 없습니다.', ()=>{
      visits = visits.filter(x=>x.id!==delId);
      saveVisits(visits);
      render();
      syncDelete(delId);
    }, '삭제');
  } else if(action==='nav-list'){
    state.view='list'; render();
  } else if(action==='save'){
    current.updatedAt = Date.now();
    const idx = visits.findIndex(x=>x.id===current.id);
    if(idx>=0) visits[idx]=current; else visits.push(current);
    saveVisits(visits);
    syncPush(current);
    state.view='list';
    render();
  } else if(action==='toggle'){
    const key = t.dataset.key, val = t.dataset.value;
    current.values[key] = (current.values[key]===val) ? null : val;
    const group = t.parentElement.querySelectorAll('.segbtn');
    group.forEach(b=>b.classList.remove('active'));
    if(current.values[key]===val) t.classList.add('active');
  } else if(action==='sig-clear'){
    const canvas = document.getElementById('sigCanvas');
    const ratio = window.devicePixelRatio||1;
    sigCtx.clearRect(0,0,canvas.width/ratio,canvas.height/ratio);
    current.info.signature='';
  } else if(action==='save-pdf'){
    openReportModal();
  } else if(action==='copy-text'){
    state.modal = { type:'text', content: buildSummary(current) };
    renderModal();
  } else if(action==='modal-close'){
    state.modal=null;
    const m=document.getElementById('modalRoot'); if(m) m.remove();
  } else if(action==='modal-confirm-yes'){
    const cb = state.modal && state.modal.onConfirm;
    state.modal=null;
    const m=document.getElementById('modalRoot'); if(m) m.remove();
    if(cb) cb();
  } else if(action==='modal-copy'){
    const ta = document.querySelector('textarea.copybox');
    if(ta){ ta.focus(); ta.select(); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(state.modal.content)
        .then(()=>{ showAlert('클립보드에 복사되었습니다.'); })
        .catch(()=>{ showAlert('자동 복사가 지원되지 않는 환경입니다. 위 상자가 전체 선택되어 있으니, 길게 눌러 "복사"를 선택해 주세요.'); });
    } else {
      showAlert('이 화면에서는 자동 복사가 지원되지 않습니다. 위 상자가 전체 선택되어 있으니, 길게 눌러 "복사"를 선택해 주세요.');
    }
  } else if(action==='backup'){
    state.modal = { type:'backup' };
    renderModal();
  } else if(action==='settings'){
    state.modal = { type:'settings' };
    renderModal();
  } else if(action==='settings-save'){
    const box = document.getElementById('settingsModalBox');
    const get = (key)=> box.querySelector(`textarea[data-key="${key}"]`).value;
    const t = {
      exL: parseLinesPreserve(get('exL')),
      exR: parseLinesPreserve(get('exR')),
      wtL: parseLinesPreserve(get('wtL')),
      wtR: parseLinesPreserve(get('wtR')),
      bsL: parseLinesPreserve(get('bsL')),
      bsR: parseLinesPreserve(get('bsR')),
      hygiene: parseLinesFilter(get('hygiene')),
      cooking: parseLinesFilter(get('cooking')),
      operation: parseLinesFilter(get('operation'))
    };
    saveTemplate(t);
    state.modal=null;
    const mm=document.getElementById('modalRoot'); if(mm) mm.remove();
    render();
    showAlert('체크리스트 항목이 저장되었습니다.');
  } else if(action==='settings-reset'){
    showConfirm('모든 항목을 기본값으로 되돌릴까요?', ()=>{
      saveTemplate(defaultTemplate());
      render();
      showAlert('기본값으로 초기화되었습니다.');
    }, '초기화');
  } else if(action==='export-json'){
    const blob = new Blob([JSON.stringify(visits,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `bapulix_visits_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } else if(action==='export-json-text'){
    state.modal = { type:'text', content: JSON.stringify(visits, null, 2) };
    renderModal();
  } else if(action==='save-sync-url'){
    const input = document.getElementById('syncUrlInput');
    setSyncUrl(input.value);
    state.modal = { type:'backup' };
    renderModal();
    showAlert('연동 주소가 저장되었습니다.');
  } else if(action==='sync-now'){
    syncNow();
  }
});

function syncFieldPath(e){
  const path = e.target.dataset.path;
  if(!path || !current) return;
  setPath(current, path, e.target.value);
  if(path==='info.store' || path==='info.date'){
    const h1 = document.querySelector('.topbar h1');
    const sub = document.querySelector('.topbar .sub');
    if(h1) h1.textContent = current.info.store || '새 방문 체크리스트';
    if(sub) sub.textContent = current.info.date || '';
  }
}
document.addEventListener('input', syncFieldPath);
document.addEventListener('change', syncFieldPath);

document.addEventListener('input', (e)=>{
  if(e.target.dataset.action==='search'){
    state.search = e.target.value;
    const caret = e.target.selectionStart;
    render();
    const el = document.querySelector('[data-action="search"]');
    if(el){ el.focus(); el.setSelectionRange(caret,caret); }
  }
});

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(Array.isArray(data)){
        showConfirm(`${data.length}건의 기록을 불러옵니다. 기존 저장된 기록과 합쳐집니다. 계속할까요?`, ()=>{
          const ids = new Set(visits.map(v=>v.id));
          data.forEach(v=>{ if(!ids.has(v.id)) visits.push(v); });
          saveVisits(visits);
          render();
          showAlert('불러오기가 완료되었습니다.');
        }, '불러오기');
      } else { showAlert('올바른 백업 파일이 아닙니다.'); }
    }catch(err){ showAlert('파일을 읽을 수 없습니다.'); }
  };
  reader.readAsText(file);
}

/* ---------------- Init ---------------- */
render();
</script>
